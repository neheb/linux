%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/ti,keystone-psc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments Keystone PSC Clock

maintainers:
  - Murali Karicheri <m-karicheri2@ti.com>

description: |
  Binding for Keystone gate control driver which uses PSC (Power Sleep
  Controller) IP for clock gating.

  This binding uses the common clock binding[1].

  [1] Documentation/devicetree/bindings/clock/clock-bindings.txt

properties:
  compatible:
    const: ti,keystone,psc-clock

  "#clock-cells":
    const: 0

  clocks:
    description: Parent clock phandle.

  clock-output-names:
    description: From common clock binding to override the default output
      clock name.

  reg:
    description: PSC control and domain register base addresses and sizes.
    minItems: 2
    maxItems: 2

  reg-names:
    description: Must be "control" and "domain".
    items:
      - const: control
      - const: domain

  domain-id:
    description: PSC domain id needed to check the transition state register.
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - "#clock-cells"
  - clocks
  - reg
  - reg-names
  - domain-id

additionalProperties: false

examples:
  - |
    clocks {
        clkusb: clkusb@2350008 {
            #clock-cells = <0>;
            compatible = "ti,keystone,psc-clock";
            clocks = <&chipclk16>;
            clock-output-names = "usb";
            reg = <0x02350008 0xb00>, <0x02350000 0x400>;
            reg-names = "control", "domain";
            domain-id = <0>;
        };
    };
