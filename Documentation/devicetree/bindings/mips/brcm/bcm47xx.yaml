%YAML 1.2
---
$id: http://devicetree.org/schemas/mips/brcm/bcm47xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM47xx MIPS based platforms

maintainers:
  - Hauke Mehrtens <hauke@hauke-m.de>
  - Rafał Miłecki <zajec5@gmail.com>

description:
  Wireless routers and access points built around the MIPS 74K based
  BCM47xx SoCs, whose cores sit on a Broadcom AXI (bcma) bus.

properties:
  $nodename:
    const: '/'

  compatible:
    oneOf:
      - description: BCM4718 based boards
        items:
          - enum:
              - asus,rt-n16
          - const: brcm,bcm4718

additionalProperties: true

...
