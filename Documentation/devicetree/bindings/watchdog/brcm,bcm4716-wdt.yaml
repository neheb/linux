%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/brcm,bcm4716-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom BCM4716 watchdog timer

maintainers:
  - Rosen Penev <rosenp@gmail.com>

description: >
  The PMU in the ChipCommon core of BCM4716, BCM4717 and BCM4718 SoCs has a
  watchdog timer. It counts down at the 32 kHz ILP rate and resets the chip
  when it expires.

  The watchdog registers are part of ChipCommon, so this node must be a
  child of the ChipCommon syscon node.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: brcm,bcm4716-wdt

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    watchdog {
        compatible = "brcm,bcm4716-wdt";
    };
